version: 2

models:
  - name: mart_mrt_premium_by_band
    description: >
      Grain: one row per MRT distance band. Naive median price per sqm by band, and
      each band's premium over the farthest. Published to the edition and FINDINGS.md.
    columns:
      - name: band_order
        data_tests: [unique, not_null]
      - name: mrt_band
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["0-400m", "400-800m", "800m-1.2km", "over 1.2km"]
      - name: sales
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"
      - name: median_price_psm
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"

  - name: mart_price_index
    description: >
      Grain: one row per month. Naive (median psm) and hedonic (all-years model) price
      indices, Jan 2017 = 100, with the hedonic index's 95% interval.
    columns:
      - name: month
        data_tests: [unique, not_null]
      - name: hedonic_index
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"
      - name: naive_index
        data_tests: [not_null]

  - name: mart_model_vs_naive
    description: "Grain: one row per MRT band and lease band. Naive premium beside the model's."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [term, level]
    columns:
      - name: model_pct
        data_tests: [not_null]

  - name: mart_effects_by_year
    description: "Grain: one row per year, term and level, for town, MRT band and lease band."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [calendar_year, term, level]
