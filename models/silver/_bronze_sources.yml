version: 2

sources:
  - name: bronze
    description: >
      The immutable landing zone written by ingest/hdb_resale.py: one Hive-style parquet
      partition per transaction month. DuckDB reads the glob directly and recovers
      `month` from the directory names, so there is no load step between the raw
      files and the warehouse.
    meta:
      # Overridable so CI can build against the committed fixture instead of a real
      # bronze layer it has no way to produce offline:
      #   dbt build --vars '{bronze_glob: data/fixture/hdb_resale/month=*/*.parquet}'
      external_location: "{{ var('bronze_glob', 'data/bronze/hdb_resale/month=*/*.parquet') }}"
    tables:
      - name: hdb_resale
        description: One row per resale transaction, exactly as data.gov.sg returned it.
