# The base Streamlit draws its own widgets with -- filters, tables, menus -- so they match
# the page. The rest of the look (fonts, cards, motion) lives in dashboard/theme.py, and
# the chart colours in dashboard/charts.py were validated against this white surface.
[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#fafafa"
secondaryBackgroundColor = "#f4f4f5"
textColor = "#18181b"
font = "sans serif"
