name: CI

# Every pull request builds the whole warehouse and runs every test. It does this
# against a committed fixture rather than the live API: a pull request that fails
# because data.gov.sg is rate-limiting says nothing about the pull request.
on:
  pull_request:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DBT_PROFILES_DIR: .
      DUCKDB_PATH: data/fixture/warehouse.duckdb

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Ingest unit tests
        run: pytest

      - name: Seed the fixture bronze layer
        run: python -m ingest.seed_fixture

      - name: Build the warehouse and run the data tests
        run: |
          dbt deps
          dbt build --vars '{bronze_glob: "data/fixture/hdb_resale/month=*/*.parquet"}'

      # Publishes the fixture warehouse into a throwaway directory. The point is the
      # export against a real dbt build -- every published mart exists and has the
      # columns the edition expects. It never writes to published/: only a deliberate
      # local publish changes what the dashboard and FINDINGS.md show.
      - name: Publish a smoke-test edition from the fixture
        run: python -m publish.build_edition --out data/fixture/published

      - name: FINDINGS.md and README.md match the committed edition
        run: python -m publish.render_findings --check

      # The Explore page recomputes the descriptive figures in pandas; unfiltered, they
      # must equal the SQL marts. Checked on the edition CI just built and the committed one.
      - name: Explore matches the published marts
        run: |
          python -m dashboard.check_parity --edition data/fixture/published
          python -m dashboard.check_parity
